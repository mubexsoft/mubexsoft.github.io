<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Mubex kelime ezber ve quiz uygulamaları"
    >

    <meta
        name="theme-color"
        content="#071426"
    >

    <title>Mubex</title>


    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f6f8fc;

            color: #101828;

            overflow-x: hidden;

        }


        button,
        a {

            font: inherit;

            -webkit-tap-highlight-color: transparent;

        }


        img {

            user-select: none;

            -webkit-user-drag: none;

        }



        /* =========================================================
           HERO
        ========================================================= */

        .hero {

            position: relative;

            min-height: 790px;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            padding:

                max(
                    35px,
                    env(safe-area-inset-top)
                )

                20px

                65px;


            background:

                radial-gradient(
                    circle at 50% 37%,
                    rgba(61, 143, 255, 0.50),
                    transparent 31%
                ),

                radial-gradient(
                    circle at 10% 8%,
                    rgba(131, 88, 255, 0.22),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 88% 82%,
                    rgba(37, 203, 180, 0.18),
                    transparent 29%
                ),

                linear-gradient(
                    145deg,
                    #06101f 0%,
                    #0b203e 48%,
                    #071426 100%
                );

        }


        .hero::before {

            content: "";

            position: absolute;

            z-index: 1;

            width: 1000px;

            height: 1000px;

            left: 50%;

            top: 82%;

            transform:

                translate(
                    -50%,
                    -50%
                );

            border-radius: 50%;


            background:

                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0) 65%
                );


            pointer-events: none;

        }


        .hero::after {

            content: "";

            position: absolute;

            z-index: 2;

            inset: 0;


            background:

                linear-gradient(
                    180deg,
                    transparent 70%,
                    rgba(4, 10, 20, 0.18) 100%
                );


            pointer-events: none;

        }



        /* =========================================================
           FLOATING ICON AREA
        ========================================================= */

        .floating-icons {

            position: absolute;

            z-index: 3;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

        }



        /* =========================================================
           PHYSICS APP ICON
        ========================================================= */

        .floating-icon {

            position: absolute;

            left: 0;

            top: 0;


            width:

                clamp(
                    95px,
                    7.5vw,
                    135px
                );


            aspect-ratio: 1;


            border-radius: 22%;


            object-fit: cover;


            /*
             * SAYDAMLIK YOK.
             *
             * OPACITY 1.
             */

            opacity: 1;


            visibility: hidden;


            box-shadow:

                0 28px 58px
                rgba(0, 0, 0, 0.36),

                0 0 30px
                rgba(255, 255, 255, 0.06);


            will-change: transform;


            transform-origin: center;

        }



        /* =========================================================
           HERO CONTENT
        ========================================================= */

        .hero-content {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 1400px;

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        .hero-title {

            position: relative;

            z-index: 30;

            color: #ffffff;

            font-size:

                clamp(
                    39px,
                    5vw,
                    73px
                );

            font-weight: 800;

            letter-spacing: -3px;

            line-height: 1.05;

            text-align: center;

        }


        .hero-title span {

            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #8fc5ff
                );


            -webkit-background-clip: text;

            background-clip: text;


            -webkit-text-fill-color: transparent;

        }


        .hero-description {

            position: relative;

            z-index: 30;

            max-width: 650px;

            margin-top: 17px;

            margin-bottom: 25px;

            padding: 0 15px;

            color:

                rgba(
                    255,
                    255,
                    255,
                    0.72
                );

            font-size: 18px;

            line-height: 1.6;

            text-align: center;

        }



        /* =========================================================
           PHONE STAGE
        ========================================================= */

        .phone-stage {

            position: relative;

            z-index: 20;

            width:

                min(
                    1080px,
                    100%
                );

            height: 510px;

            perspective: 1900px;

        }


        .phone {

            position: absolute;

            top: 50%;

            left: 50%;

            width: 215px;

            opacity: 0;

            border:

                6px solid
                #0b0d11;

            border-radius: 36px;

            background: #0b0d11;

            overflow: hidden;


            box-shadow:

                0 45px 95px
                rgba(0, 0, 0, 0.58),

                0 13px 32px
                rgba(0, 0, 0, 0.42);


            will-change:

                transform,
                left,
                opacity;

        }


        .phone img {

            display: block;

            width: 100%;

            height: auto;

            border-radius: 29px;

        }



        /* =========================================================
           PHONE 1
        ========================================================= */

        .phone-1 {

            z-index: 1;


            animation:

                phoneOneIn

                5s

                cubic-bezier(
                    .16,
                    .84,
                    .24,
                    1
                )

                0.45s

                forwards;

        }


        @keyframes phoneOneIn {

            0% {

                left: 50%;

                opacity: 0;


                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(0.60)

                    rotateY(0deg)

                    rotateZ(0deg);

            }


            100% {

                left: 20%;

                opacity: 1;


                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(0.68)

                    rotateY(19deg)

                    rotateZ(-4deg);

            }

        }



        /* =========================================================
           PHONE 2
        ========================================================= */

        .phone-2 {

            z-index: 4;


            animation:

                phoneTwoIn

                4.7s

                cubic-bezier(
                    .16,
                    .84,
                    .24,
                    1
                )

                0.22s

                forwards;

        }


        @keyframes phoneTwoIn {

            0% {

                left: 50%;

                opacity: 0;


                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(0.65);

            }


            100% {

                left: 35%;

                opacity: 1;


                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(0.84)

                    rotateY(11deg)

                    rotateZ(-2deg);

            }

        }



        /* =========================================================
           PHONE 3
        ========================================================= */

        .phone-3 {

            z-index: 10;


            animation:

                phoneCenterIn

                4.4s

                cubic-bezier(
                    .16,
                    .84,
                    .24,
                    1
                )

                forwards;

        }


        @keyframes phoneCenterIn {

            0% {

                left: 50%;

                opacity: 0;


                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(0.58)

                    translateZ(-200px);

            }


            100% {

                left: 50%;

                opacity: 1;


                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(1)

                    translateZ(170px);

            }

        }



        /* =========================================================
           PHONE 4
        ========================================================= */

        .phone-4 {

            z-index: 4;


            animation:

                phoneFourIn

                4.7s

                cubic-bezier(
                    .16,
                    .84,
                    .24,
                    1
                )

                0.22s

                forwards;

        }


        @keyframes phoneFourIn {

            0% {

                left: 50%;

                opacity: 0;


                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(0.65);

            }


            100% {

                left: 65%;

                opacity: 1;


                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(0.84)

                    rotateY(-11deg)

                    rotateZ(2deg);

            }

        }



        /* =========================================================
           PHONE 5
        ========================================================= */

        .phone-5 {

            z-index: 1;


            animation:

                phoneFiveIn

                5s

                cubic-bezier(
                    .16,
                    .84,
                    .24,
                    1
                )

                0.45s

                forwards;

        }


        @keyframes phoneFiveIn {

            0% {

                left: 50%;

                opacity: 0;


                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(0.60)

                    rotateY(0deg)

                    rotateZ(0deg);

            }


            100% {

                left: 80%;

                opacity: 1;


                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(0.68)

                    rotateY(-19deg)

                    rotateZ(4deg);

            }

        }



        /* =========================================================
           APPS SECTION
        ========================================================= */

        .apps-section {

            position: relative;


            padding:

                85px

                20px

                105px;

        }


        .section-container {

            width: 100%;

            max-width: 1120px;

            margin: 0 auto;

        }


        .section-title {

            color: #101828;


            font-size:

                clamp(
                    31px,
                    5vw,
                    49px
                );


            font-weight: 800;

            letter-spacing: -1.7px;

            line-height: 1.1;

            text-align: center;

        }


        .section-description {

            max-width: 610px;


            margin:

                17px

                auto

                50px;


            color: #667085;

            font-size: 17px;

            line-height: 1.65;

            text-align: center;

        }



        /* =========================================================
           APP GRID
        ========================================================= */

        .app-grid {

            display: grid;


            grid-template-columns:

                repeat(
                    4,
                    minmax(
                        0,
                        1fr
                    )
                );


            gap: 22px;

        }



        /* =========================================================
           APP CARD
        ========================================================= */

        .app-card {

            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            min-width: 0;


            padding:

                29px

                16px

                25px;


            border:

                1px solid

                rgba(
                    16,
                    24,
                    40,
                    0.055
                );


            border-radius: 29px;

            outline: none;

            background: #ffffff;

            color: inherit;

            text-decoration: none;

            cursor: pointer;


            box-shadow:

                0 10px 32px

                rgba(
                    16,
                    24,
                    40,
                    0.065
                );


            transition:

                transform 0.38s ease,

                box-shadow 0.38s ease,

                border-color 0.38s ease;

        }


        .app-card:hover,
        .app-card:focus-visible {

            transform:

                translateY(-8px);


            border-color:

                rgba(
                    52,
                    120,
                    246,
                    0.16
                );


            box-shadow:

                0 24px 50px

                rgba(
                    16,
                    24,
                    40,
                    0.14
                );

        }



        /* =========================================================
           APP ICON
        ========================================================= */

        .app-icon {

            width: 118px;

            max-width: 75%;

            aspect-ratio: 1;

            border-radius: 24%;

            object-fit: cover;

            opacity: 1;


            box-shadow:

                0 16px 33px

                rgba(
                    16,
                    24,
                    40,
                    0.17
                );


            transition:

                transform
                0.38s
                ease;

        }


        .app-card:hover .app-icon,
        .app-card:focus-visible .app-icon {

            transform:

                scale(1.06)

                rotate(-2deg);

        }


        .app-name {

            margin-top: 22px;

            color: #101828;

            font-size: 18px;

            font-weight: 750;

            line-height: 1.35;

            text-align: center;

        }


        .app-subtitle {

            margin-top: 8px;

            color: #667085;

            font-size: 14px;

            line-height: 1.5;

            text-align: center;

        }


        .store-text {

            margin-top: auto;

            padding-top: 18px;

            color: #3478f6;

            font-size: 14px;

            font-weight: 650;

        }



        /* =========================================================
           LOADING
        ========================================================= */

        .loading {

            grid-column:

                1 / -1;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 250px;

            color: #667085;

            font-size: 16px;

        }


        .loading-spinner {

            width: 38px;

            height: 38px;

            margin-bottom: 18px;


            border:

                4px solid

                rgba(
                    52,
                    120,
                    246,
                    0.15
                );


            border-top-color: #3478f6;

            border-radius: 50%;


            animation:

                loadingSpin
                0.9s
                linear
                infinite;

        }


        @keyframes loadingSpin {

            to {

                transform:

                    rotate(
                        360deg
                    );

            }

        }



        /* =========================================================
           ERROR
        ========================================================= */

        .error-message {

            grid-column:

                1 / -1;


            padding:

                45px
                25px;


            border-radius: 25px;

            background: #fff0f0;

            color: #d92d20;

            line-height: 1.6;

            text-align: center;

        }



        /* =========================================================
           MODAL
        ========================================================= */

        .store-modal {

            position: fixed;

            z-index: 999;

            inset: 0;

            display: none;

            justify-content: center;

            align-items: center;

            padding: 20px;


            background:

                rgba(
                    5,
                    13,
                    25,
                    0.74
                );


            backdrop-filter:

                blur(
                    13px
                );


            -webkit-backdrop-filter:

                blur(
                    13px
                );

        }


        .store-modal.active {

            display: flex;

        }


        .store-box {

            width: 100%;

            max-width: 390px;

            padding: 29px;

            border-radius: 31px;

            background: #ffffff;


            box-shadow:

                0 38px 100px

                rgba(
                    0,
                    0,
                    0,
                    0.36
                );


            animation:

                modalIn
                0.38s
                ease;

        }


        @keyframes modalIn {

            from {

                opacity: 0;


                transform:

                    translateY(
                        25px
                    )

                    scale(
                        0.93
                    );

            }


            to {

                opacity: 1;


                transform:

                    translateY(
                        0
                    )

                    scale(
                        1
                    );

            }

        }


        .modal-icon {

            display: block;

            width: 85px;

            height: 85px;


            margin:

                0
                auto
                19px;


            border-radius: 22%;

            object-fit: cover;

            opacity: 1;


            box-shadow:

                0 14px 28px

                rgba(
                    16,
                    24,
                    40,
                    0.15
                );

        }


        .store-box h3 {

            color: #101828;

            font-size: 23px;

            line-height: 1.35;

            text-align: center;

        }


        .store-box p {

            margin:

                10px
                0
                23px;

            color: #667085;

            line-height: 1.5;

            text-align: center;

        }


        .store-button {

            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 16px;

            border: none;

            border-radius: 17px;

            font-size: 16px;

            font-weight: 700;

            text-align: center;

            text-decoration: none;

            cursor: pointer;

        }


        .apple-button {

            background: #090909;

            color: #ffffff;

        }


        .google-button {

            background: #edf4ff;

            color: #245bbc;

        }


        .close-button {

            background: transparent;

            color: #667085;

        }



        /* =========================================================
           TABLET
        ========================================================= */

        @media (
            max-width: 950px
        ) {


            .app-grid {

                grid-template-columns:

                    repeat(
                        3,
                        minmax(
                            0,
                            1fr
                        )
                    );

            }


            .phone {

                width: 195px;

            }


            .floating-icon {

                width:

                    clamp(
                        85px,
                        10vw,
                        115px
                    );

            }

        }



        /* =========================================================
           MOBILE
        ========================================================= */

        @media (
            max-width: 600px
        ) {


            .hero {

                min-height: 690px;


                padding:

                    max(
                        30px,
                        env(safe-area-inset-top)
                    )

                    0

                    45px;

            }


            .hero-title {

                padding: 0 20px;


                font-size:

                    clamp(
                        37px,
                        11vw,
                        52px
                    );


                letter-spacing: -2px;

            }


            .hero-description {

                margin-top: 13px;

                margin-bottom: 10px;

                padding: 0 37px;

                font-size: 15px;

                line-height: 1.55;

            }


            .phone-stage {

                height: 430px;

            }


            .phone {

                width:

                    min(
                        42vw,
                        174px
                    );


                border-width: 4px;

                border-radius: 29px;

            }


            .phone img {

                border-radius: 24px;

            }


            .floating-icon {

                width:

                    clamp(
                        68px,
                        19vw,
                        88px
                    );

            }



            /* PHONE 1 MOBILE */

            @keyframes phoneOneIn {

                0% {

                    left: 50%;

                    opacity: 0;


                    transform:

                        translate(
                            -50%,
                            -50%
                        )

                        scale(
                            0.55
                        );

                }


                100% {

                    left: 20%;

                    opacity: 1;


                    transform:

                        translate(
                            -50%,
                            -50%
                        )

                        scale(
                            0.59
                        )

                        rotateY(
                            15deg
                        )

                        rotateZ(
                            -4deg
                        );

                }

            }



            /* PHONE 2 MOBILE */

            @keyframes phoneTwoIn {

                0% {

                    left: 50%;

                    opacity: 0;


                    transform:

                        translate(
                            -50%,
                            -50%
                        )

                        scale(
                            0.61
                        );

                }


                100% {

                    left: 35%;

                    opacity: 1;


                    transform:

                        translate(
                            -50%,
                            -50%
                        )

                        scale(
                            0.77
                        )

                        rotateY(
                            8deg
                        )

                        rotateZ(
                            -2deg
                        );

                }

            }



            /* CENTER MOBILE */

            @keyframes phoneCenterIn {

                0% {

                    left: 50%;

                    opacity: 0;


                    transform:

                        translate(
                            -50%,
                            -50%
                        )

                        scale(
                            0.58
                        );

                }


                100% {

                    left: 50%;

                    opacity: 1;


                    transform:

                        translate(
                            -50%,
                            -50%
                        )

                        scale(
                            1
                        );

                }

            }



            /* PHONE 4 MOBILE */

            @keyframes phoneFourIn {

                0% {

                    left: 50%;

                    opacity: 0;


                    transform:

                        translate(
                            -50%,
                            -50%
                        )

                        scale(
                            0.61
                        );

                }


                100% {

                    left: 65%;

                    opacity: 1;


                    transform:

                        translate(
                            -50%,
                            -50%
                        )

                        scale(
                            0.77
                        )

                        rotateY(
                            -8deg
                        )

                        rotateZ(
                            2deg
                        );

                }

            }



            /* PHONE 5 MOBILE */

            @keyframes phoneFiveIn {

                0% {

                    left: 50%;

                    opacity: 0;


                    transform:

                        translate(
                            -50%,
                            -50%
                        )

                        scale(
                            0.55
                        );

                }


                100% {

                    left: 80%;

                    opacity: 1;


                    transform:

                        translate(
                            -50%,
                            -50%
                        )

                        scale(
                            0.59
                        )

                        rotateY(
                            -15deg
                        )

                        rotateZ(
                            4deg
                        );

                }

            }


            .apps-section {

                padding:

                    65px

                    14px

                    max(
                        75px,
                        env(safe-area-inset-bottom)
                    );

            }


            .section-title {

                font-size: 34px;

            }


            .section-description {

                margin-bottom: 36px;

                padding: 0 18px;

                font-size: 15px;

            }


            .app-grid {

                grid-template-columns:

                    repeat(
                        2,
                        minmax(
                            0,
                            1fr
                        )
                    );


                gap: 13px;

            }


            .app-card {

                padding:

                    20px
                    9px
                    18px;


                border-radius: 22px;

            }


            .app-icon {

                width: 96px;

                border-radius: 22%;

            }


            .app-name {

                margin-top: 16px;

                font-size: 15px;

            }


            .app-subtitle {

                font-size: 12px;

            }


            .store-text {

                padding-top: 14px;

                font-size: 12px;

            }


            .store-box {

                padding: 25px;

            }

        }



        /* =========================================================
           SMALL MOBILE
        ========================================================= */

        @media (
            max-width: 370px
        ) {


            .hero-title {

                font-size: 35px;

            }


            .phone {

                width: 158px;

            }


            .floating-icon {

                width: 64px;

            }


            .app-grid {

                gap: 10px;

            }


            .app-icon {

                width: 82px;

            }


            .app-name {

                font-size: 14px;

            }

        }



        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (
            prefers-reduced-motion: reduce
        ) {


            .phone {

                animation-duration:
                    0.01ms !important;

            }

        }

    </style>

</head>



<body>


<!-- =============================================================
     HERO
============================================================= -->

<section class="hero">



    <div
        id="floatingIcons"
        class="floating-icons"
        aria-hidden="true"
    ></div>



    <div class="hero-content">


        <h1 class="hero-title">

            <span>MUBEX</span>


        </h1>


        <p class="hero-description">

            Sınava ve seviyene özel kelime ezberleme,
            quiz ve tekrar uygulamaları.

        </p>



        <div
            id="phoneStage"
            class="phone-stage"
        ></div>


    </div>


</section>



<!-- =============================================================
     APPS
============================================================= -->

<section class="apps-section">


    <div class="section-container">


        <h2 class="section-title">

            Uygulamalarımız

        </h2>


        <p class="section-description">

            Hazırlandığın sınava veya İngilizce seviyene
            uygun Mubex uygulamasını seç.

        </p>



        <div
            id="appGrid"
            class="app-grid"
        >


            <div class="loading">


                <div
                    class="loading-spinner"
                    aria-hidden="true"
                ></div>


                Uygulamalar yükleniyor...


            </div>


        </div>


    </div>


</section>



<!-- =============================================================
     STORE MODAL
============================================================= -->

<div
    id="storeModal"
    class="store-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalAppName"
>


    <div class="store-box">


        <img
            id="modalAppIcon"
            class="modal-icon"
            src=""
            alt=""
        >


        <h3 id="modalAppName">

            Mubex

        </h3>


        <p>

            Uygulamayı indireceğin mağazayı seç.

        </p>


        <a
            id="appleStoreButton"
            class="store-button apple-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >

            App Store

        </a>


        <a
            id="googleStoreButton"
            class="store-button google-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >

            Google Play

        </a>


        <button
            id="closeModal"
            class="store-button close-button"
            type="button"
        >

            Kapat

        </button>


    </div>


</div>



<script>

    "use strict";


    /* =============================================================
       CONFIG
    ============================================================= */

    const API_URL =

        "https://mubexsoft.github.io/mobile_api/other_eng_apps.json";



    const phoneScreens = [


        "assets/s1.png",

        "assets/s2.png",

        "assets/s3.png",

        "assets/s4.png",

        "assets/s5.png"

    ];



    /* =============================================================
       DOM
    ============================================================= */

    const appGrid =

        document.getElementById(
            "appGrid"
        );


    const floatingIcons =

        document.getElementById(
            "floatingIcons"
        );


    const phoneStage =

        document.getElementById(
            "phoneStage"
        );


    const storeModal =

        document.getElementById(
            "storeModal"
        );


    const modalAppName =

        document.getElementById(
            "modalAppName"
        );


    const modalAppIcon =

        document.getElementById(
            "modalAppIcon"
        );


    const appleStoreButton =

        document.getElementById(
            "appleStoreButton"
        );


    const googleStoreButton =

        document.getElementById(
            "googleStoreButton"
        );


    const closeModal =

        document.getElementById(
            "closeModal"
        );



    /* =============================================================
       PHYSICS STATE
    ============================================================= */

    let iconBodies = [];


    let physicsAnimationId = null;


    let previousFrameTime = 0;


    let resizeTimer = null;



    /* =============================================================
       RANDOM
    ============================================================= */

    function randomBetween(
        min,
        max
    ) {


        return (

            Math.random()

            *

            (
                max - min
            )

            +

            min

        );


    }



    /* =============================================================
       CREATE PHONES
    ============================================================= */

    function createPhones() {


        phoneStage.innerHTML = "";


        phoneScreens.forEach(

            (
                screen,
                index
            ) => {


                const phone =

                    document.createElement(
                        "div"
                    );


                phone.className =

                    `phone phone-${index + 1}`;



                const image =

                    document.createElement(
                        "img"
                    );


                image.src =

                    screen;


                image.alt =

                    `Mubex uygulama ekranı ${index + 1}`;


                image.decoding =

                    "async";


                if (
                    index === 2
                ) {


                    image.fetchPriority =

                        "high";


                }



                phone.appendChild(
                    image
                );


                phoneStage.appendChild(
                    phone
                );


            }

        );


    }



    /* =============================================================
       DEVICE
    ============================================================= */

    function getDeviceType() {


        const userAgent =

            navigator.userAgent || "";


        const isIPadOS =

            navigator.platform === "MacIntel"

            &&

            navigator.maxTouchPoints > 1;



        if (
            /android/i.test(
                userAgent
            )
        ) {


            return "android";


        }



        if (

            /iPad|iPhone|iPod/.test(
                userAgent
            )

            ||

            isIPadOS

        ) {


            return "ios";


        }



        return "desktop";


    }



    /* =============================================================
       URL
    ============================================================= */

    function hasValidUrl(
        url
    ) {


        return (

            typeof url === "string"

            &&

            url.trim().length > 0

            &&

            url.trim() !== "#"

        );


    }



    /* =============================================================
       OPEN APP
    ============================================================= */

    function openApp(
        app
    ) {


        const device =

            getDeviceType();



        if (

            device === "ios"

            &&

            hasValidUrl(
                app.app_store_url
            )

        ) {


            window.location.href =

                app.app_store_url;


            return;


        }



        if (

            device === "android"

            &&

            hasValidUrl(
                app.google_play_url
            )

        ) {


            window.location.href =

                app.google_play_url;


            return;


        }



        modalAppName.textContent =

            app.app_name;


        modalAppIcon.src =

            app.icon_path;


        modalAppIcon.alt =

            app.app_name;



        const hasAppleStore =

            hasValidUrl(
                app.app_store_url
            );


        const hasGooglePlay =

            hasValidUrl(
                app.google_play_url
            );



        appleStoreButton.style.display =

            hasAppleStore

                ? "block"

                : "none";


        googleStoreButton.style.display =

            hasGooglePlay

                ? "block"

                : "none";



        if (
            hasAppleStore
        ) {


            appleStoreButton.href =

                app.app_store_url;


        }



        if (
            hasGooglePlay
        ) {


            googleStoreButton.href =

                app.google_play_url;


        }



        storeModal.classList.add(
            "active"
        );


        document.body.style.overflow =

            "hidden";


    }



    /* =============================================================
       CREATE FLOAT ICON ELEMENTS
    ============================================================= */

    function renderFloatingIcons(
        apps
    ) {


        stopPhysics();


        iconBodies = [];


        floatingIcons.innerHTML = "";



        apps
            .slice(
                0,
                11
            )
            .forEach(

                app => {


                    const image =

                        document.createElement(
                            "img"
                        );


                    /*
                     * İKON URL'Sİ JSON'DAN GELİR.
                     */

                    image.src =

                        app.icon_path;


                    image.alt = "";


                    image.className =

                        "floating-icon";


                    image.decoding =

                        "async";


                    image.loading =

                        "eager";



                    floatingIcons.appendChild(
                        image
                    );


                }

            );



        /*
         * CSS BOYUTLARININ HESAPLANMASINI BEKLE.
         */

        requestAnimationFrame(

            () => {


                requestAnimationFrame(

                    () => {


                        initialisePhysics();


                    }

                );


            }

        );


    }



    /* =============================================================
       CHECK POSITION COLLISION
    ============================================================= */

    function isPositionFree(

        x,

        y,

        radius,

        bodies

    ) {


        for (
            const body of bodies
        ) {


            const dx =

                body.x - x;


            const dy =

                body.y - y;


            const minimumDistance =

                body.radius

                +

                radius

                +

                8;


            if (

                (
                    dx * dx
                )

                +

                (
                    dy * dy
                )

                <

                (
                    minimumDistance
                    *
                    minimumDistance
                )

            ) {


                return false;


            }


        }



        return true;


    }



    /* =============================================================
       FIND NON OVERLAPPING POSITION
    ============================================================= */

    function findFreePosition(

        radius,

        width,

        height,

        bodies

    ) {


        const padding =

            8;



        for (

            let attempt = 0;

            attempt < 2500;

            attempt++

        ) {


            const x =

                randomBetween(

                    radius + padding,

                    width - radius - padding

                );


            const y =

                randomBetween(

                    radius + padding,

                    height - radius - padding

                );



            if (

                isPositionFree(

                    x,

                    y,

                    radius,

                    bodies

                )

            ) {


                return {

                    x,

                    y

                };


            }


        }



        /*
         * RANDOM YER BULAMAZSA GRID TARAMASI.
         */

        const step =

            radius * 2 + 10;



        for (

            let y = radius + padding;

            y <= height - radius;

            y += step

        ) {


            for (

                let x = radius + padding;

                x <= width - radius;

                x += step

            ) {


                if (

                    isPositionFree(

                        x,

                        y,

                        radius,

                        bodies

                    )

                ) {


                    return {

                        x,

                        y

                    };


                }


            }


        }




        return {

            x: randomBetween(
                radius,
                width - radius
            ),

            y: randomBetween(
                radius,
                height - radius
            )

        };


    }



    /* =============================================================
       INITIALISE PHYSICS
    ============================================================= */

    function initialisePhysics() {


        stopPhysics();


        const containerRect =

            floatingIcons.getBoundingClientRect();



        const width =

            containerRect.width;


        const height =

            containerRect.height;



        if (

            width <= 0

            ||

            height <= 0

        ) {


            return;


        }



        const elements =

            Array.from(

                floatingIcons.querySelectorAll(
                    ".floating-icon"
                )

            );



        const isMobile =

            window.matchMedia(
                "(max-width: 600px)"
            ).matches;



        const minimumSpeed =

            isMobile

                ? 20

                : 28;


        const maximumSpeed =

            isMobile

                ? 34

                : 46;



        iconBodies = [];



        elements.forEach(

            (
                element,
                index
            ) => {


                const rect =

                    element.getBoundingClientRect();


                const radius =

                    rect.width / 2;



                const position =

                    findFreePosition(

                        radius,

                        width,

                        height,

                        iconBodies

                    );



                const angle =

                    randomBetween(

                        0,

                        Math.PI * 2

                    );



                const speed =

                    randomBetween(

                        minimumSpeed,

                        maximumSpeed

                    );



                iconBodies.push({

                    element,

                    x: position.x,

                    y: position.y,

                    radius,

                    vx:

                        Math.cos(
                            angle
                        )

                        *

                        speed,

                    vy:

                        Math.sin(
                            angle
                        )

                        *

                        speed,

                    rotation:

                        randomBetween(
                            -12,
                            12
                        ),

                    angularVelocity:

                        randomBetween(
                            -3,
                            3
                        )

                });



                element.style.visibility =

                    "visible";


            }

        );



        /*
         * İLK FRAME
         */

        iconBodies.forEach(

            renderBody

        );



        previousFrameTime =

            performance.now();



        physicsAnimationId =

            requestAnimationFrame(
                physicsLoop
            );


    }



    /* =============================================================
       BOUNDARY COLLISION
    ============================================================= */

    function resolveBoundaryCollision(

        body,

        width,

        height

    ) {


        /*
         * SOL
         */

        if (

            body.x - body.radius < 0

        ) {


            body.x =

                body.radius;


            body.vx =

                Math.abs(
                    body.vx
                );


        }



        /*
         * SAĞ
         */

        if (

            body.x + body.radius > width

        ) {


            body.x =

                width - body.radius;


            body.vx =

                -Math.abs(
                    body.vx
                );


        }



        /*
         * ÜST
         */

        if (

            body.y - body.radius < 0

        ) {


            body.y =

                body.radius;


            body.vy =

                Math.abs(
                    body.vy
                );


        }



        /*
         * ALT
         */

        if (

            body.y + body.radius > height

        ) {


            body.y =

                height - body.radius;


            body.vy =

                -Math.abs(
                    body.vy
                );


        }


    }



    /* =============================================================
       ELASTIC COLLISION
       EQUAL MASS BILLIARD PHYSICS
    ============================================================= */

    function resolveIconCollision(

        bodyA,

        bodyB

    ) {


        let dx =

            bodyB.x - bodyA.x;


        let dy =

            bodyB.y - bodyA.y;



        let distanceSquared =

            dx * dx

            +

            dy * dy;



        const minimumDistance =

            bodyA.radius

            +

            bodyB.radius;



        if (

            distanceSquared

            >=

            minimumDistance
            *
            minimumDistance

        ) {


            return;


        }



        /*
         * MERKEZLER TAM AYNI NOKTADAYSA
         * SIFIRA BÖLMEYİ ENGELLE.
         */

        if (

            distanceSquared === 0

        ) {


            dx = 0.01;


            dy = 0;


            distanceSquared =

                dx * dx;


        }



        const distance =

            Math.sqrt(
                distanceSquared
            );



        /*
         * NORMAL VEKTÖR
         */

        const normalX =

            dx / distance;


        const normalY =

            dy / distance;



        /*
         * ÜST ÜSTE BİNMİŞLERSE
         * FİZİK HESABINDAN ÖNCE AYIR.
         */

        const overlap =

            minimumDistance

            -

            distance;



        const separation =

            overlap / 2

            +

            0.1;



        bodyA.x -=

            normalX
            *
            separation;


        bodyA.y -=

            normalY
            *
            separation;



        bodyB.x +=

            normalX
            *
            separation;


        bodyB.y +=

            normalY
            *
            separation;



        /*
         * RELATIVE VELOCITY
         */

        const relativeVelocityX =

            bodyB.vx

            -

            bodyA.vx;


        const relativeVelocityY =

            bodyB.vy

            -

            bodyA.vy;



        const velocityAlongNormal =

            relativeVelocityX

            *

            normalX

            +

            relativeVelocityY

            *

            normalY;



        /*
         * ZATEN BİRBİRİNDEN UZAKLAŞIYORLARSA
         * YENİDEN İMPULSE UYGULAMA.
         */

        if (

            velocityAlongNormal >= 0

        ) {


            return;


        }



        /*
         * RESTITUTION = 1
         *
         * TAM ELASTİK ÇARPIŞMA.
         */

        const restitution =

            1;



        /*
         * İKİ İKONUN KÜTLESİ EŞİT.
         *
         * m1 = 1
         * m2 = 1
         */

        const impulseMagnitude =

            -(
                1 + restitution
            )

            *

            velocityAlongNormal

            /

            2;



        const impulseX =

            impulseMagnitude

            *

            normalX;


        const impulseY =

            impulseMagnitude

            *

            normalY;



        /*
         * BODY A
         */

        bodyA.vx -=

            impulseX;


        bodyA.vy -=

            impulseY;



        /*
         * BODY B
         */

        bodyB.vx +=

            impulseX;


        bodyB.vy +=

            impulseY;



        /*
         * ÇARPIŞINCA HAFİF DÖNÜŞ ETKİSİ.
         *
         * SADECE GÖRSEL.
         */

        const tangentVelocity =

            relativeVelocityX
            *
            -normalY

            +

            relativeVelocityY
            *
            normalX;



        bodyA.angularVelocity +=

            tangentVelocity
            *
            0.015;


        bodyB.angularVelocity -=

            tangentVelocity
            *
            0.015;



        /*
         * ÇOK HIZLI DÖNMESİN.
         */

        bodyA.angularVelocity =

            Math.max(

                -9,

                Math.min(
                    9,
                    bodyA.angularVelocity
                )

            );


        bodyB.angularVelocity =

            Math.max(

                -9,

                Math.min(
                    9,
                    bodyB.angularVelocity
                )

            );


    }



    /* =============================================================
       RENDER BODY
    ============================================================= */

    function renderBody(
        body
    ) {


        body.element.style.transform =

            `translate3d(
                ${body.x - body.radius}px,
                ${body.y - body.radius}px,
                0
            )
            rotate(
                ${body.rotation}deg
            )`;


    }



    /* =============================================================
       PHYSICS LOOP
    ============================================================= */

    function physicsLoop(
        currentTime
    ) {


        const containerRect =

            floatingIcons.getBoundingClientRect();



        const width =

            containerRect.width;


        const height =

            containerRect.height;



        /*
         * TAB ARKA PLANA GEÇİP GERİ GELİRSE
         * DEV BİR FRAME DELTA OLUŞMASIN.
         */

        const deltaTime =

            Math.min(

                (
                    currentTime
                    -
                    previousFrameTime
                )

                /

                1000,

                0.035

            );



        previousFrameTime =

            currentTime;



        /*
         * POSITION UPDATE
         */

        for (

            const body of iconBodies

        ) {


            body.x +=

                body.vx

                *

                deltaTime;


            body.y +=

                body.vy

                *

                deltaTime;


            body.rotation +=

                body.angularVelocity

                *

                deltaTime;



            resolveBoundaryCollision(

                body,

                width,

                height

            );


        }



        /*
         * İKON - İKON ÇARPIŞMA
         *
         * 11 İKON OLDUĞU İÇİN
         * O(N²) RAHATLIKLA YETERLİ.
         */

        for (

            let firstIndex = 0;

            firstIndex
            <
            iconBodies.length;

            firstIndex++

        ) {


            for (

                let secondIndex =
                    firstIndex + 1;

                secondIndex
                <
                iconBodies.length;

                secondIndex++

            ) {


                resolveIconCollision(

                    iconBodies[
                        firstIndex
                    ],

                    iconBodies[
                        secondIndex
                    ]

                );


            }


        }



        for (

            const body of iconBodies

        ) {


            resolveBoundaryCollision(

                body,

                width,

                height

            );


            renderBody(
                body
            );


        }



        physicsAnimationId =

            requestAnimationFrame(
                physicsLoop
            );


    }



    /* =============================================================
       STOP PHYSICS
    ============================================================= */

    function stopPhysics() {


        if (

            physicsAnimationId !== null

        ) {


            cancelAnimationFrame(

                physicsAnimationId

            );


            physicsAnimationId =

                null;


        }


    }



    /* =============================================================
       APP CARD
    ============================================================= */

    function createAppCard(
        app
    ) {


        const card =

            document.createElement(
                "article"
            );


        card.className =

            "app-card";


        card.tabIndex =

            0;


        card.setAttribute(

            "role",

            "link"

        );


        card.setAttribute(

            "aria-label",

            `${app.app_name} uygulamasını görüntüle`

        );



        const icon =

            document.createElement(
                "img"
            );


        icon.className =

            "app-icon";


        icon.src =

            app.icon_path;


        icon.alt =

            app.app_name;


        icon.loading =

            "lazy";


        icon.decoding =

            "async";



        const name =

            document.createElement(
                "h3"
            );


        name.className =

            "app-name";


        name.textContent =

            app.app_name;



        const description =

            document.createElement(
                "p"
            );


        description.className =

            "app-subtitle";


        description.textContent =

            app.app_description || "";



        const storeText =

            document.createElement(
                "span"
            );


        storeText.className =

            "store-text";


        storeText.textContent =

            "Uygulamayı Gör →";



        card.appendChild(
            icon
        );


        card.appendChild(
            name
        );


        card.appendChild(
            description
        );


        card.appendChild(
            storeText
        );



        card.addEventListener(

            "click",

            () => {


                openApp(
                    app
                );


            }

        );



        card.addEventListener(

            "keydown",

            event => {


                if (

                    event.key === "Enter"

                    ||

                    event.key === " "

                ) {


                    event.preventDefault();


                    openApp(
                        app
                    );


                }


            }

        );



        return card;


    }



    /* =============================================================
       RENDER APPS
    ============================================================= */

    function renderApps(
        apps
    ) {


        appGrid.innerHTML = "";


        apps.forEach(

            app => {


                appGrid.appendChild(

                    createAppCard(
                        app
                    )

                );


            }

        );


    }



    /* =============================================================
       LOAD JSON
    ============================================================= */

    async function loadApps() {


        try {


            const response =

                await fetch(

                    API_URL,

                    {

                        method: "GET",

                        cache: "no-store",

                        headers: {

                            "Accept":

                                "application/json"

                        }

                    }

                );



            if (

                !response.ok

            ) {


                throw new Error(

                    `HTTP ${response.status}`

                );


            }



            const data =

                await response.json();



            if (

                !data

                ||

                !Array.isArray(
                    data.other_eng_apps
                )

            ) {


                throw new Error(

                    "Geçersiz API response"

                );


            }



            const apps =

                data.other_eng_apps

                    .filter(

                        app =>

                            app.is_active === true

                    )

                    .sort(

                        (
                            appA,
                            appB
                        ) => {


                            const orderA =

                                Number(
                                    appA.order
                                ) || 0;


                            const orderB =

                                Number(
                                    appB.order
                                ) || 0;


                            return (

                                orderA

                                -

                                orderB

                            );


                        }

                    );



            if (

                apps.length === 0

            ) {


                throw new Error(

                    "Aktif uygulama yok"

                );


            }



            renderApps(
                apps
            );


            renderFloatingIcons(
                apps
            );


        }

        catch (
            error
        ) {


            console.error(

                "Mubex uygulamaları yüklenemedi:",

                error

            );


            appGrid.innerHTML = `

                <div class="error-message">

                    Uygulamalar şu anda yüklenemedi.

                    <br>

                    Lütfen daha sonra tekrar deneyin.

                </div>

            `;


        }


    }



    /* =============================================================
       MODAL
    ============================================================= */

    function closeStoreModal() {


        storeModal.classList.remove(
            "active"
        );


        document.body.style.overflow =

            "";


    }



    closeModal.addEventListener(

        "click",

        closeStoreModal

    );



    storeModal.addEventListener(

        "click",

        event => {


            if (

                event.target === storeModal

            ) {


                closeStoreModal();


            }


        }

    );



    document.addEventListener(

        "keydown",

        event => {


            if (

                event.key === "Escape"

                &&

                storeModal.classList.contains(
                    "active"
                )

            ) {


                closeStoreModal();


            }


        }

    );



    /* =============================================================
       RESIZE
    ============================================================= */

    window.addEventListener(

        "resize",

        () => {


            clearTimeout(
                resizeTimer
            );


            resizeTimer =

                setTimeout(

                    () => {


                        initialisePhysics();


                    },

                    200

                );


        },

        {

            passive: true

        }

    );



    /* =============================================================
       TAB VISIBILITY
    ============================================================= */

    document.addEventListener(

        "visibilitychange",

        () => {


            if (

                document.hidden

            ) {


                previousFrameTime =

                    performance.now();


            }

            else {


                previousFrameTime =

                    performance.now();


            }


        }

    );



    /* =============================================================
       INIT
    ============================================================= */

    createPhones();


    loadApps();


</script>

<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#071426"
    >

    <meta
        name="description"
        content="Mubex uygulamaları"
    >

    <title>Mubex Uygulamaları</title>


    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            width: 100%;
            min-height: 100%;
            background: #071426;
            scroll-behavior: smooth;
        }


        body {

            width: 100%;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f6f8fc;

            color: #101828;

            overflow-x: hidden;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

        }


        button,
        a {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }


        img {
            display: block;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }



        /* =========================================================
           HERO
        ========================================================= */

        .hero {

            position: relative;

            width: 100%;

            min-height: 760px;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            padding:
                max(35px, env(safe-area-inset-top))
                20px
                55px;


            background:

                radial-gradient(
                    circle at 50% 38%,
                    rgba(61, 143, 255, 0.50),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 8% 8%,
                    rgba(131, 88, 255, 0.20),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 90% 82%,
                    rgba(37, 203, 180, 0.18),
                    transparent 28%
                ),

                linear-gradient(
                    145deg,
                    #06101f 0%,
                    #0b203e 48%,
                    #071426 100%
                );

        }



        /* =========================================================
           FLOATING ICON AREA
        ========================================================= */

        .floating-icons {

            position: absolute;

            z-index: 2;

            top: 0;
            right: 0;
            bottom: 0;
            left: 0;

            overflow: hidden;

            pointer-events: none;

        }



        /* =========================================================
           FLOATING ICON
        ========================================================= */

        .floating-icon {

            position: absolute;

            top: 0;
            left: 0;

            width: clamp(90px, 7.5vw, 132px);
            height: clamp(90px, 7.5vw, 132px);

            object-fit: cover;

            border-radius: 22%;

            opacity: 1;

            visibility: hidden;


            box-shadow:

                0 24px 50px
                rgba(0, 0, 0, 0.35);


            transform: translate3d(0, 0, 0);

            -webkit-transform: translate3d(0, 0, 0);

            backface-visibility: hidden;

            -webkit-backface-visibility: hidden;

            will-change: transform;


            /*
             * IOS SAFARI BORDER RADIUS
             */

            -webkit-mask-image:
                -webkit-radial-gradient(
                    white,
                    black
                );

        }



        /* =========================================================
           HERO CONTENT
        ========================================================= */

        .hero-content {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 1400px;

            display: flex;

            flex-direction: column;

            align-items: center;

        }



        /* =========================================================
           TITLE
        ========================================================= */

        .hero-title {

            position: relative;

            z-index: 30;

            color: #ffffff;

            font-size: clamp(40px, 5vw, 72px);

            font-weight: 800;

            letter-spacing: -3px;

            line-height: 1.05;

            text-align: center;

        }


        .hero-title span {

            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #8fc5ff
                );

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;

        }



        /* =========================================================
           PHONE STAGE
        ========================================================= */

        .phone-stage {

            position: relative;

            z-index: 20;

            width: min(1080px, 100%);

            height: 540px;

            margin-top: 22px;

        }



        /* =========================================================
           PHONE
        ========================================================= */

        .phone {

            position: absolute;

            top: 50%;
            left: 50%;

            width: 215px;

            aspect-ratio: 390 / 844;

            overflow: hidden;

            border: 6px solid #0b0d11;

            border-radius: 36px;

            background: #0b0d11;


            box-shadow:

                0 42px 90px
                rgba(0, 0, 0, 0.55),

                0 12px 30px
                rgba(0, 0, 0, 0.40);


            opacity: 1;


            transform:
                translate3d(
                    -50%,
                    -50%,
                    0
                );


            -webkit-transform:
                translate3d(
                    -50%,
                    -50%,
                    0
                );


            backface-visibility: hidden;

            -webkit-backface-visibility: hidden;

            will-change:
                transform,
                left,
                opacity;


            -webkit-mask-image:
                -webkit-radial-gradient(
                    white,
                    black
                );

        }


        .phone img {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 29px;

            transform: translate3d(0, 0, 0);

            -webkit-transform: translate3d(0, 0, 0);

            backface-visibility: hidden;

            -webkit-backface-visibility: hidden;

        }



        /* =========================================================
           DESKTOP 5 PHONES
        ========================================================= */

        .phone-stage.desktop .phone-1 {

            z-index: 1;

            animation:
                desktopPhone1
                4.8s
                cubic-bezier(.16, .84, .24, 1)
                both;

        }


        .phone-stage.desktop .phone-2 {

            z-index: 4;

            animation:
                desktopPhone2
                4.5s
                cubic-bezier(.16, .84, .24, 1)
                both;

        }


        .phone-stage.desktop .phone-3 {

            z-index: 10;

            animation:
                desktopPhone3
                4.2s
                cubic-bezier(.16, .84, .24, 1)
                both;

        }


        .phone-stage.desktop .phone-4 {

            z-index: 4;

            animation:
                desktopPhone4
                4.5s
                cubic-bezier(.16, .84, .24, 1)
                both;

        }


        .phone-stage.desktop .phone-5 {

            z-index: 1;

            animation:
                desktopPhone5
                4.8s
                cubic-bezier(.16, .84, .24, 1)
                both;

        }



        @keyframes desktopPhone1 {

            from {

                left: 50%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.62);

            }


            to {

                left: 20%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.68)
                    rotate(-4deg);

            }

        }


        @keyframes desktopPhone2 {

            from {

                left: 50%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.65);

            }


            to {

                left: 35%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.84)
                    rotate(-2deg);

            }

        }


        @keyframes desktopPhone3 {

            from {

                left: 50%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.60);

            }


            to {

                left: 50%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(1);

            }

        }


        @keyframes desktopPhone4 {

            from {

                left: 50%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.65);

            }


            to {

                left: 65%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.84)
                    rotate(2deg);

            }

        }


        @keyframes desktopPhone5 {

            from {

                left: 50%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.62);

            }


            to {

                left: 80%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.68)
                    rotate(4deg);

            }

        }



        /* =========================================================
           MOBILE 3 PHONES
        ========================================================= */

        .phone-stage.mobile .phone-1 {

            z-index: 4;

            animation:
                mobilePhoneLeft
                4.5s
                cubic-bezier(.16, .84, .24, 1)
                both;

        }


        .phone-stage.mobile .phone-2 {

            z-index: 10;

            animation:
                mobilePhoneCenter
                4.2s
                cubic-bezier(.16, .84, .24, 1)
                both;

        }


        .phone-stage.mobile .phone-3 {

            z-index: 4;

            animation:
                mobilePhoneRight
                4.5s
                cubic-bezier(.16, .84, .24, 1)
                both;

        }



        @keyframes mobilePhoneLeft {

            from {

                left: 50%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.65);

            }


            to {

                left: 20%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.78)
                    rotate(-3deg);

            }

        }


        @keyframes mobilePhoneCenter {

            from {

                left: 50%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.58);

            }


            to {

                left: 50%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(1);

            }

        }


        @keyframes mobilePhoneRight {

            from {

                left: 50%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.65);

            }


            to {

                left: 80%;

                opacity: 1;

                transform:
                    translate3d(-50%, -50%, 0)
                    scale(0.78)
                    rotate(3deg);

            }

        }



        /* =========================================================
           APPS SECTION
        ========================================================= */

        .apps-section {

            position: relative;

            padding:
                85px
                20px
                105px;

            background: #f6f8fc;

        }


        .section-container {

            width: 100%;

            max-width: 1120px;

            margin: 0 auto;

        }


        .section-title {

            color: #101828;

            font-size: clamp(32px, 5vw, 49px);

            font-weight: 800;

            letter-spacing: -1.7px;

            line-height: 1.1;

            text-align: center;

            margin-bottom: 50px;

        }



        /* =========================================================
           APP GRID
        ========================================================= */

        .app-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );

            gap: 22px;

        }



        /* =========================================================
           APP CARD
        ========================================================= */

        .app-card {

            position: relative;

            min-width: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding:
                29px
                16px
                25px;

            border:
                1px solid
                rgba(16, 24, 40, 0.055);

            border-radius: 29px;

            outline: none;

            background: #ffffff;

            color: inherit;

            text-decoration: none;

            cursor: pointer;


            box-shadow:

                0 10px 32px
                rgba(16, 24, 40, 0.065);


            transition:

                transform 0.35s ease,

                box-shadow 0.35s ease,

                border-color 0.35s ease;

        }


        .app-card:hover,
        .app-card:focus-visible {

            transform:
                translateY(-7px);

            border-color:
                rgba(52, 120, 246, 0.16);

            box-shadow:

                0 24px 50px
                rgba(16, 24, 40, 0.14);

        }



        /* =========================================================
           APP ICON
        ========================================================= */

        .app-icon {

            width: 118px;
            height: 118px;

            max-width: 75%;

            object-fit: cover;

            border-radius: 24%;


            box-shadow:

                0 16px 33px
                rgba(16, 24, 40, 0.17);


            -webkit-mask-image:
                -webkit-radial-gradient(
                    white,
                    black
                );

        }


        .app-name {

            margin-top: 22px;

            color: #101828;

            font-size: 18px;

            font-weight: 750;

            line-height: 1.35;

            text-align: center;

        }


        .store-text {

            margin-top: auto;

            padding-top: 19px;

            color: #3478f6;

            font-size: 14px;

            font-weight: 650;

        }



        /* =========================================================
           LOADING
        ========================================================= */

        .loading {

            grid-column: 1 / -1;

            min-height: 250px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color: #667085;

        }


        .loading-spinner {

            width: 38px;
            height: 38px;

            margin-bottom: 18px;

            border:
                4px solid
                rgba(52, 120, 246, 0.15);

            border-top-color: #3478f6;

            border-radius: 50%;

            animation:
                loadingSpin
                0.9s
                linear
                infinite;

        }


        @keyframes loadingSpin {

            to {
                transform: rotate(360deg);
            }

        }



        /* =========================================================
           ERROR
        ========================================================= */

        .error-message {

            grid-column: 1 / -1;

            padding: 45px 25px;

            border-radius: 25px;

            background: #fff0f0;

            color: #d92d20;

            text-align: center;

        }



        /* =========================================================
           STORE MODAL
        ========================================================= */

        .store-modal {

            position: fixed;

            z-index: 999;

            top: 0;
            right: 0;
            bottom: 0;
            left: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding:
                20px
                20px
                max(
                    20px,
                    env(safe-area-inset-bottom)
                );

            background:
                rgba(5, 13, 25, 0.86);

        }


        .store-modal.active {
            display: flex;
        }


        .store-box {

            width: 100%;

            max-width: 390px;

            padding: 29px;

            border-radius: 31px;

            background: #ffffff;


            box-shadow:

                0 38px 100px
                rgba(0, 0, 0, 0.36);

        }


        .modal-icon {

            width: 85px;
            height: 85px;

            margin:
                0
                auto
                19px;

            border-radius: 22%;

            object-fit: cover;


            box-shadow:

                0 14px 28px
                rgba(16, 24, 40, 0.15);

        }


        .store-box h3 {

            color: #101828;

            font-size: 23px;

            line-height: 1.35;

            text-align: center;

        }


        .store-button {

            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 16px;

            border: none;

            border-radius: 17px;

            font-size: 16px;

            font-weight: 700;

            text-align: center;

            text-decoration: none;

            cursor: pointer;

        }


        .apple-button {

            margin-top: 25px;

            background: #090909;

            color: #ffffff;

        }


        .google-button {

            background: #edf4ff;

            color: #245bbc;

        }


        .close-button {

            background: transparent;

            color: #667085;

        }



        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 950px) {


            .app-grid {

                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

            }


            .phone {
                width: 195px;
            }


            .floating-icon {

                width: clamp(82px, 10vw, 112px);
                height: clamp(82px, 10vw, 112px);

            }

        }



        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {


            .hero {

                min-height: 650px;

                padding:
                    max(
                        25px,
                        env(safe-area-inset-top)
                    )
                    0
                    35px;

            }


            .hero-title {

                padding: 0 20px;

                font-size:
                    clamp(
                        38px,
                        11vw,
                        52px
                    );

                letter-spacing: -2px;

            }


            .phone-stage {

                width: 100%;

                height: 455px;

                margin-top: 5px;

            }


            .phone {

                width:
                    min(
                        48vw,
                        184px
                    );

                border-width: 4px;

                border-radius: 29px;

            }


            .phone img {
                border-radius: 24px;
            }


            .floating-icon {

                width: clamp(65px, 19vw, 86px);

                height: clamp(65px, 19vw, 86px);

            }


            .apps-section {

                padding:
                    65px
                    14px
                    max(
                        75px,
                        env(safe-area-inset-bottom)
                    );

            }


            .section-title {

                margin-bottom: 38px;

                font-size: 34px;

            }


            .app-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                gap: 13px;

            }


            .app-card {

                padding:
                    20px
                    9px
                    18px;

                border-radius: 22px;

            }


            .app-icon {

                width: 96px;
                height: 96px;

                border-radius: 22%;

            }


            .app-name {

                margin-top: 16px;

                font-size: 15px;

            }


            .store-text {

                padding-top: 15px;

                font-size: 12px;

            }


            .store-box {
                padding: 25px;
            }

        }



        /* =========================================================
           IOS SAFARI
        ========================================================= */

        @supports (-webkit-touch-callout: none) {


            html,
            body {

                min-height:
                    -webkit-fill-available;

            }


            .hero {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    );

                -webkit-transform:
                    translate3d(
                        0,
                        0,
                        0
                    );

            }


            .phone,
            .phone img,
            .floating-icon {

                backface-visibility: hidden;

                -webkit-backface-visibility: hidden;

            }

        }



        /* =========================================================
           SMALL MOBILE
        ========================================================= */

        @media (max-width: 370px) {


            .hero-title {
                font-size: 35px;
            }


            .phone {
                width: 160px;
            }


            .floating-icon {

                width: 62px;
                height: 62px;

            }


            .app-grid {
                gap: 10px;
            }


            .app-icon {

                width: 82px;
                height: 82px;

            }


            .app-name {
                font-size: 14px;
            }

        }



        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .phone {
                animation-duration: 0.01ms !important;
            }

        }

    </style>

</head>



<body>


<section class="hero">


    <div
        id="floatingIcons"
        class="floating-icons"
        aria-hidden="true"
    ></div>


    <div class="hero-content">


        <h1 class="hero-title">

            <span>MUBEX</span>
        </h1>


        <div
            id="phoneStage"
            class="phone-stage"
        ></div>


    </div>


</section>



<section class="apps-section">


    <div class="section-container">


        <h2 class="section-title">

            Uygulamalarımız

        </h2>


        <div
            id="appGrid"
            class="app-grid"
        >


            <div class="loading">


                <div
                    class="loading-spinner"
                ></div>


                Uygulamalar yükleniyor...


            </div>


        </div>


    </div>


</section>



<div
    id="storeModal"
    class="store-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalAppName"
>


    <div class="store-box">


        <img
            id="modalAppIcon"
            class="modal-icon"
            src=""
            alt=""
        >


        <h3 id="modalAppName">

            Mubex

        </h3>


        <a
            id="appleStoreButton"
            class="store-button apple-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >

            App Store

        </a>


        <a
            id="googleStoreButton"
            class="store-button google-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >

            Google Play

        </a>


        <button
            id="closeModal"
            class="store-button close-button"
            type="button"
        >

            Kapat

        </button>


    </div>


</div>



<script>

    "use strict";


    /* =============================================================
       CONFIG
    ============================================================= */

    const API_URL =
        "https://mubexsoft.github.io/mobile_api/other_eng_apps.json";


    const MOBILE_BREAKPOINT = 600;


    const DESKTOP_SCREENS = [

        "assets/s1.png",

        "assets/s2.png",

        "assets/s3.png",

        "assets/s4.png",

        "assets/s5.png"

    ];


    const MOBILE_SCREENS = [

        "assets/s2.png",

        "assets/s3.png",

        "assets/s4.png"

    ];



    /* =============================================================
       DOM
    ============================================================= */

    const appGrid =
        document.getElementById("appGrid");


    const floatingIcons =
        document.getElementById("floatingIcons");


    const phoneStage =
        document.getElementById("phoneStage");


    const storeModal =
        document.getElementById("storeModal");


    const modalAppName =
        document.getElementById("modalAppName");


    const modalAppIcon =
        document.getElementById("modalAppIcon");


    const appleStoreButton =
        document.getElementById("appleStoreButton");


    const googleStoreButton =
        document.getElementById("googleStoreButton");


    const closeModal =
        document.getElementById("closeModal");



    /* =============================================================
       STATE
    ============================================================= */

    let iconBodies = [];


    let physicsAnimationId = null;


    let previousFrameTime = 0;


    let currentPhoneMode = null;


    let resizeTimer = null;



    /* =============================================================
       HELPERS
    ============================================================= */

    function isMobile() {

        return (
            window.innerWidth <= MOBILE_BREAKPOINT
        );

    }


    function randomBetween(
        min,
        max
    ) {

        return (
            Math.random()
            *
            (max - min)
            +
            min
        );

    }


    function hasValidUrl(
        url
    ) {

        return (

            typeof url === "string"

            &&

            url.trim() !== ""

            &&

            url.trim() !== "#"

        );

    }



    /* =============================================================
       PHONES
    ============================================================= */

    function renderPhones() {


        const mode =

            isMobile()
                ? "mobile"
                : "desktop";


        if (
            currentPhoneMode === mode
        ) {

            return;

        }


        currentPhoneMode = mode;


        const screens =

            mode === "mobile"
                ? MOBILE_SCREENS
                : DESKTOP_SCREENS;


        phoneStage.className =

            `phone-stage ${mode}`;


        phoneStage.innerHTML = "";


        screens.forEach(

            (
                screen,
                index
            ) => {


                const phone =

                    document.createElement("div");


                phone.className =

                    `phone phone-${index + 1}`;



                const image =

                    document.createElement("img");


                image.src = screen;


                image.alt =

                    `Mubex uygulama ekranı ${index + 1}`;


                image.decoding =

                    "async";


                if (

                    (
                        mode === "mobile"
                        &&
                        index === 1
                    )

                    ||

                    (
                        mode === "desktop"
                        &&
                        index === 2
                    )

                ) {

                    image.fetchPriority =

                        "high";

                }


                phone.appendChild(image);


                phoneStage.appendChild(phone);


            }

        );


    }



    /* =============================================================
       DEVICE
    ============================================================= */

    function getDeviceType() {


        const userAgent =

            navigator.userAgent || "";


        const isIPadOS =

            navigator.platform === "MacIntel"

            &&

            navigator.maxTouchPoints > 1;


        if (
            /android/i.test(userAgent)
        ) {

            return "android";

        }


        if (

            /iPad|iPhone|iPod/.test(userAgent)

            ||

            isIPadOS

        ) {

            return "ios";

        }


        return "desktop";

    }



    /* =============================================================
       APP OPEN
    ============================================================= */

    function openApp(
        app
    ) {


        const device =

            getDeviceType();


        if (

            device === "ios"

            &&

            hasValidUrl(
                app.app_store_url
            )

        ) {

            window.location.assign(
                app.app_store_url
            );

            return;

        }


        if (

            device === "android"

            &&

            hasValidUrl(
                app.google_play_url
            )

        ) {

            window.location.assign(
                app.google_play_url
            );

            return;

        }


        modalAppName.textContent =

            app.app_name;


        modalAppIcon.src =

            app.icon_path;


        modalAppIcon.alt =

            app.app_name;


        const hasAppleStore =

            hasValidUrl(
                app.app_store_url
            );


        const hasGooglePlay =

            hasValidUrl(
                app.google_play_url
            );


        appleStoreButton.style.display =

            hasAppleStore
                ? "block"
                : "none";


        googleStoreButton.style.display =

            hasGooglePlay
                ? "block"
                : "none";


        if (
            hasAppleStore
        ) {

            appleStoreButton.href =

                app.app_store_url;

        }


        if (
            hasGooglePlay
        ) {

            googleStoreButton.href =

                app.google_play_url;

        }


        storeModal.classList.add(
            "active"
        );


        document.body.style.overflow =

            "hidden";

    }



    /* =============================================================
       FLOATING ICONS
    ============================================================= */

    function renderFloatingIcons(
        apps
    ) {


        stopPhysics();


        iconBodies = [];


        floatingIcons.innerHTML = "";


        apps
            .slice(0, 11)
            .forEach(

                app => {


                    const image =

                        document.createElement("img");


                    image.src =

                        app.icon_path;


                    image.alt = "";


                    image.className =

                        "floating-icon";


                    image.loading =

                        "eager";


                    image.decoding =

                        "async";


                    floatingIcons.appendChild(
                        image
                    );


                }

            );


        waitForFloatingImages()
            .then(

                () => {


                    requestAnimationFrame(

                        () => {

                            initialisePhysics();

                        }

                    );

                }

            );

    }



    /* =============================================================
       WAIT IMAGES
    ============================================================= */

    function waitForFloatingImages() {


        const images =

            Array.from(

                floatingIcons.querySelectorAll(
                    ".floating-icon"
                )

            );


        return Promise.all(

            images.map(

                image => {


                    if (
                        image.complete
                    ) {

                        return Promise.resolve();

                    }


                    return new Promise(

                        resolve => {


                            image.addEventListener(

                                "load",

                                resolve,

                                {
                                    once: true
                                }

                            );


                            image.addEventListener(

                                "error",

                                resolve,

                                {
                                    once: true
                                }

                            );


                        }

                    );

                }

            )

        );

    }



    /* =============================================================
       POSITION CHECK
    ============================================================= */

    function isPositionFree(

        x,

        y,

        radius,

        bodies

    ) {


        for (
            const body of bodies
        ) {


            const dx =

                x - body.x;


            const dy =

                y - body.y;


            const minimumDistance =

                radius

                +

                body.radius

                +

                8;


            if (

                dx * dx

                +

                dy * dy

                <

                minimumDistance
                *
                minimumDistance

            ) {

                return false;

            }

        }


        return true;

    }



    /* =============================================================
       FIND POSITION
    ============================================================= */

    function findFreePosition(

        radius,

        width,

        height,

        bodies

    ) {


        const padding = 6;


        const minX =

            radius + padding;


        const maxX =

            Math.max(

                minX,

                width - radius - padding

            );


        const minY =

            radius + padding;


        const maxY =

            Math.max(

                minY,

                height - radius - padding

            );


        for (

            let attempt = 0;

            attempt < 3000;

            attempt++

        ) {


            const x =

                randomBetween(
                    minX,
                    maxX
                );


            const y =

                randomBetween(
                    minY,
                    maxY
                );


            if (

                isPositionFree(

                    x,

                    y,

                    radius,

                    bodies

                )

            ) {

                return {
                    x,
                    y
                };

            }

        }


        const step =

            radius * 2 + 10;


        for (

            let y = minY;

            y <= maxY;

            y += step

        ) {


            for (

                let x = minX;

                x <= maxX;

                x += step

            ) {


                if (

                    isPositionFree(

                        x,

                        y,

                        radius,

                        bodies

                    )

                ) {

                    return {
                        x,
                        y
                    };

                }

            }

        }


        return {

            x: minX,

            y: minY

        };

    }



    /* =============================================================
       INIT PHYSICS
    ============================================================= */

    function initialisePhysics() {


        stopPhysics();


        const rect =

            floatingIcons.getBoundingClientRect();


        const width =

            rect.width;


        const height =

            rect.height;


        if (

            width <= 0

            ||

            height <= 0

        ) {

            return;

        }


        const elements =

            Array.from(

                floatingIcons.querySelectorAll(
                    ".floating-icon"
                )

            );


        const mobile =

            isMobile();


        const minSpeed =

            mobile
                ? 16
                : 22;


        const maxSpeed =

            mobile
                ? 27
                : 38;


        iconBodies = [];


        elements.forEach(

            element => {


                const elementRect =

                    element.getBoundingClientRect();


                const radius =

                    elementRect.width / 2;


                const position =

                    findFreePosition(

                        radius,

                        width,

                        height,

                        iconBodies

                    );


                const angle =

                    randomBetween(

                        0,

                        Math.PI * 2

                    );


                const speed =

                    randomBetween(

                        minSpeed,

                        maxSpeed

                    );


                const body = {

                    element,

                    radius,

                    x: position.x,

                    y: position.y,

                    vx:
                        Math.cos(angle)
                        *
                        speed,

                    vy:
                        Math.sin(angle)
                        *
                        speed,

                    rotation:
                        randomBetween(
                            -8,
                            8
                        ),

                    angularVelocity:
                        randomBetween(
                            -2.2,
                            2.2
                        )

                };


                iconBodies.push(body);


                element.style.visibility =

                    "visible";


                renderBody(body);

            }

        );


        previousFrameTime =

            performance.now();


        physicsAnimationId =

            requestAnimationFrame(
                physicsLoop
            );

    }



    /* =============================================================
       WALL COLLISION
    ============================================================= */

    function resolveWallCollision(

        body,

        width,

        height

    ) {


        if (
            body.x - body.radius < 0
        ) {

            body.x = body.radius;

            body.vx =
                Math.abs(body.vx);

        }


        if (
            body.x + body.radius > width
        ) {

            body.x =
                width - body.radius;

            body.vx =
                -Math.abs(body.vx);

        }


        if (
            body.y - body.radius < 0
        ) {

            body.y = body.radius;

            body.vy =
                Math.abs(body.vy);

        }


        if (
            body.y + body.radius > height
        ) {

            body.y =
                height - body.radius;

            body.vy =
                -Math.abs(body.vy);

        }

    }



    /* =============================================================
       ICON COLLISION
    ============================================================= */

    function resolveIconCollision(

        bodyA,

        bodyB

    ) {


        let dx =

            bodyB.x - bodyA.x;


        let dy =

            bodyB.y - bodyA.y;


        let distanceSquared =

            dx * dx

            +

            dy * dy;


        const minimumDistance =

            bodyA.radius

            +

            bodyB.radius;


        if (

            distanceSquared

            >=

            minimumDistance
            *
            minimumDistance

        ) {

            return;

        }


        if (
            distanceSquared < 0.0001
        ) {

            dx = 0.01;

            dy = 0;

            distanceSquared =
                dx * dx;

        }


        const distance =

            Math.sqrt(
                distanceSquared
            );


        const normalX =

            dx / distance;


        const normalY =

            dy / distance;


        const overlap =

            minimumDistance

            -

            distance;


        const separation =

            overlap / 2

            +

            0.2;


        bodyA.x -=

            normalX
            *
            separation;


        bodyA.y -=

            normalY
            *
            separation;


        bodyB.x +=

            normalX
            *
            separation;


        bodyB.y +=

            normalY
            *
            separation;


        const relativeVelocityX =

            bodyB.vx

            -

            bodyA.vx;


        const relativeVelocityY =

            bodyB.vy

            -

            bodyA.vy;


        const velocityAlongNormal =

            relativeVelocityX
            *
            normalX

            +

            relativeVelocityY
            *
            normalY;


        if (
            velocityAlongNormal >= 0
        ) {

            return;

        }


        const impulse =

            -velocityAlongNormal;


        const impulseX =

            impulse
            *
            normalX;


        const impulseY =

            impulse
            *
            normalY;


        bodyA.vx -=

            impulseX;


        bodyA.vy -=

            impulseY;


        bodyB.vx +=

            impulseX;


        bodyB.vy +=

            impulseY;


        const tangentSpeed =

            relativeVelocityX
            *
            -normalY

            +

            relativeVelocityY
            *
            normalX;


        bodyA.angularVelocity +=

            tangentSpeed
            *
            0.01;


        bodyB.angularVelocity -=

            tangentSpeed
            *
            0.01;


        bodyA.angularVelocity =

            Math.max(

                -6,

                Math.min(
                    6,
                    bodyA.angularVelocity
                )

            );


        bodyB.angularVelocity =

            Math.max(

                -6,

                Math.min(
                    6,
                    bodyB.angularVelocity
                )

            );

    }



    /* =============================================================
       RENDER BODY
    ============================================================= */

    function renderBody(
        body
    ) {


        const x =

            body.x

            -

            body.radius;


        const y =

            body.y

            -

            body.radius;


        const transform =

            `translate3d(${x}px, ${y}px, 0) rotate(${body.rotation}deg)`;


        body.element.style.transform =

            transform;


        body.element.style.webkitTransform =

            transform;

    }



    /* =============================================================
       PHYSICS LOOP
    ============================================================= */

    function physicsLoop(
        currentTime
    ) {


        const rect =

            floatingIcons.getBoundingClientRect();


        const width =

            rect.width;


        const height =

            rect.height;


        let deltaTime =

            (
                currentTime
                -
                previousFrameTime
            )

            /

            1000;


        previousFrameTime =

            currentTime;


        deltaTime =

            Math.min(
                deltaTime,
                0.03
            );


        const subSteps = 2;


        const stepTime =

            deltaTime

            /

            subSteps;


        for (

            let step = 0;

            step < subSteps;

            step++

        ) {


            for (
                const body of iconBodies
            ) {


                body.x +=

                    body.vx
                    *
                    stepTime;


                body.y +=

                    body.vy
                    *
                    stepTime;


                body.rotation +=

                    body.angularVelocity
                    *
                    stepTime;


                resolveWallCollision(

                    body,

                    width,

                    height

                );

            }


            for (

                let first = 0;

                first < iconBodies.length;

                first++

            ) {


                for (

                    let second =
                        first + 1;

                    second < iconBodies.length;

                    second++

                ) {


                    resolveIconCollision(

                        iconBodies[first],

                        iconBodies[second]

                    );

                }

            }


            for (
                const body of iconBodies
            ) {


                resolveWallCollision(

                    body,

                    width,

                    height

                );

            }

        }


        for (
            const body of iconBodies
        ) {

            renderBody(body);

        }


        physicsAnimationId =

            requestAnimationFrame(
                physicsLoop
            );

    }



    /* =============================================================
       STOP PHYSICS
    ============================================================= */

    function stopPhysics() {


        if (
            physicsAnimationId !== null
        ) {


            cancelAnimationFrame(
                physicsAnimationId
            );


            physicsAnimationId = null;

        }

    }



    /* =============================================================
       APP CARD
    ============================================================= */

    function createAppCard(
        app
    ) {


        const card =

            document.createElement(
                "article"
            );


        card.className =

            "app-card";


        card.tabIndex = 0;


        card.setAttribute(

            "role",

            "link"

        );


        card.setAttribute(

            "aria-label",

            app.app_name

        );


        const icon =

            document.createElement(
                "img"
            );


        icon.className =

            "app-icon";


        icon.src =

            app.icon_path;


        icon.alt =

            app.app_name;


        icon.loading =

            "lazy";


        icon.decoding =

            "async";


        const name =

            document.createElement(
                "h3"
            );


        name.className =

            "app-name";


        name.textContent =

            app.app_name;


        const storeText =

            document.createElement(
                "span"
            );


        storeText.className =

            "store-text";


        storeText.textContent =

            "Uygulamayı Gör →";


        card.appendChild(icon);


        card.appendChild(name);


        card.appendChild(storeText);


        card.addEventListener(

            "click",

            () => {

                openApp(app);

            }

        );


        card.addEventListener(

            "keydown",

            event => {


                if (

                    event.key === "Enter"

                    ||

                    event.key === " "

                ) {


                    event.preventDefault();


                    openApp(app);

                }

            }

        );


        return card;

    }



    /* =============================================================
       RENDER APPS
    ============================================================= */

    function renderApps(
        apps
    ) {


        appGrid.innerHTML = "";


        apps.forEach(

            app => {


                appGrid.appendChild(

                    createAppCard(app)

                );

            }

        );

    }



    /* =============================================================
       API
    ============================================================= */

    async function loadApps() {


        try {


            const response =

                await fetch(

                    API_URL,

                    {
                        cache: "no-store"
                    }

                );


            if (
                !response.ok
            ) {


                throw new Error(

                    `HTTP ${response.status}`

                );

            }


            const data =

                await response.json();


            if (

                !data

                ||

                !Array.isArray(
                    data.other_eng_apps
                )

            ) {


                throw new Error(

                    "Geçersiz JSON"

                );

            }


            const apps =

                data.other_eng_apps

                    .filter(

                        app =>

                            app.is_active === true

                    )

                    .sort(

                        (
                            appA,
                            appB
                        ) => {


                            return (

                                (
                                    Number(
                                        appA.order
                                    )
                                    ||
                                    0
                                )

                                -

                                (
                                    Number(
                                        appB.order
                                    )
                                    ||
                                    0
                                )

                            );

                        }

                    );


            if (
                apps.length === 0
            ) {


                throw new Error(

                    "Aktif uygulama yok"

                );

            }


            renderApps(apps);


            renderFloatingIcons(apps);

        }

        catch (
            error
        ) {


            console.error(

                "Uygulamalar yüklenemedi:",

                error

            );


            appGrid.innerHTML = `

                <div class="error-message">

                    Uygulamalar şu anda yüklenemedi.

                </div>

            `;

        }

    }



    /* =============================================================
       MODAL
    ============================================================= */

    function closeStoreModal() {


        storeModal.classList.remove(
            "active"
        );


        document.body.style.overflow =

            "";

    }


    closeModal.addEventListener(

        "click",

        closeStoreModal

    );


    storeModal.addEventListener(

        "click",

        event => {


            if (
                event.target === storeModal
            ) {

                closeStoreModal();

            }

        }

    );


    document.addEventListener(

        "keydown",

        event => {


            if (

                event.key === "Escape"

                &&

                storeModal.classList.contains(
                    "active"
                )

            ) {

                closeStoreModal();

            }

        }

    );



    /* =============================================================
       RESIZE
    ============================================================= */

    function handleViewportChange() {


        clearTimeout(
            resizeTimer
        );


        resizeTimer =

            setTimeout(

                () => {


                    renderPhones();


                    if (
                        iconBodies.length > 0
                    ) {

                        initialisePhysics();

                    }

                },

                300

            );

    }


    window.addEventListener(

        "resize",

        handleViewportChange,

        {
            passive: true
        }

    );


    window.addEventListener(

        "orientationchange",

        handleViewportChange,

        {
            passive: true
        }

    );



    /* =============================================================
       SAFARI PAGE CACHE
    ============================================================= */

    window.addEventListener(

        "pageshow",

        event => {


            if (
                event.persisted
            ) {


                previousFrameTime =

                    performance.now();


                renderPhones();


                if (
                    iconBodies.length > 0
                ) {

                    initialisePhysics();

                }

            }

        }

    );



    /* =============================================================
       VISIBILITY
    ============================================================= */

    document.addEventListener(

        "visibilitychange",

        () => {


            previousFrameTime =

                performance.now();

        }

    );



    /* =============================================================
       INIT
    ============================================================= */

    renderPhones();


    loadApps();

</script>
